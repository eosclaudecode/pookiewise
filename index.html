<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://apis.google.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>PookieWise</title>
<style>
  :root {
    --green: #1cc29f;
    --green-dark: #14a085;
    --orange: #ff652f;
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #24313d;
    --muted: #7a8a99;
    --border: #e3e8ec;
    --red: #d9534f;
    --radius: 10px;
    /* Diagramm-Farben (validierte Kategorienpalette, feste Reihenfolge) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s-other: #a3a29c;
    --grid: #e1e0d9; --axis: #c3c2b7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  [hidden] { display: none !important; }
  header {
    background: var(--green); color: #fff; padding: 12px 24px;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  header .logo { font-size: 22px; }
  .user { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .user img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); }
  .user .btn { background: rgba(255,255,255,.18); padding: 6px 12px; font-size: 13px; }
  .user .btn:hover { background: rgba(255,255,255,.3); }
  .layout { display: flex; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 16px; align-items: flex-start; }
  .sidebar { width: 250px; flex-shrink: 0; }
  .main { flex: 1; min-width: 0; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 12px; }
  .card h3 { font-size: 13px; color: var(--muted); margin: 10px 0 6px; font-weight: 600; }
  .center-card { max-width: 440px; margin: 60px auto; padding: 28px; text-align: center; }
  .center-card h2 { font-size: 22px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .center-card p { font-size: 14.5px; line-height: 1.6; color: #4a5a68; margin-bottom: 16px; }
  .center-card code { background: #eef2f4; padding: 1px 5px; border-radius: 4px; }
  .group-item {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    padding: 9px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 4px; font-weight: 500;
  }
  .group-item:hover { background: #eef7f4; }
  .group-item.active { background: var(--green); color: #fff; }
  .group-item .sub { font-size: 12px; opacity: .75; font-weight: 400; white-space: nowrap; }
  input, select, button { font: inherit; }
  input[type=text], input[type=date], input[type=number], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: var(--green); }
  .btn {
    background: var(--green); color: #fff; border: none; border-radius: 7px;
    padding: 9px 16px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--green-dark); }
  .btn.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { background: #f0f3f2; }
  .btn.orange { background: var(--orange); }
  .btn.danger { background: #fff; color: var(--red); border: 1px solid #f0c9c8; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.block { width: 100%; }
  .btn.google { background: #fff; color: var(--text); border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #4a5a68; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; margin-bottom: 12px; }
  .check input { width: 16px; height: 16px; accent-color: var(--green); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg label { flex: 1; text-align: center; padding: 9px 6px; cursor: pointer; font-size: 14px; font-weight: 600; border-right: 1px solid var(--border); }
  .seg label:last-child { border-right: none; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--green); outline-offset: -2px; }
  .seg label:has(input:checked) { background: var(--text); color: #fff; }
  .member-chip {
    display: inline-flex; align-items: center; gap: 6px; background: #eef7f4;
    border: 1px solid #cde9e1; border-radius: 20px; padding: 4px 6px 4px 12px; margin: 0 6px 6px 0; font-size: 14px;
  }
  .member-chip small { color: var(--muted); }
  .member-chip button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; }
  .member-chip button:hover { color: var(--red); }
  .participants { border: 1px solid var(--border); border-radius: 7px; padding: 10px; }
  .participant-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .participant-row label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
  .participant-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--green); }
  .participant-row .split-input { width: 110px; text-align: right; }
  .split-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .split-hint.error { color: var(--red); font-weight: 600; }
  .expense {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .expense:last-child { border-bottom: none; }
  .expense .date { width: 44px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.3; flex-shrink: 0; }
  .expense .date b { display: block; font-size: 16px; color: var(--text); }
  .expense .desc { flex: 1; min-width: 0; }
  .expense .desc .title { font-weight: 600; overflow-wrap: anywhere; }
  .expense .desc .sub { font-size: 12.5px; color: var(--muted); }
  .expense .amount { font-weight: 700; white-space: nowrap; }
  .expense .amount.settle { color: var(--muted); font-weight: 500; }
  .expense .actions { display: flex; gap: 4px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px; opacity: .55; }
  .icon-btn:hover { opacity: 1; }
  .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .balance-row:last-child { border-bottom: none; }
  .pos { color: var(--green-dark); font-weight: 700; }
  .neg { color: var(--orange); font-weight: 700; }
  .zero { color: var(--muted); }
  .debt-row {
    display: flex; align-items: center; gap: 8px; padding: 9px 0;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .debt-row:last-child { border-bottom: none; }
  .debt-row .who { font-weight: 600; }
  .debt-row .arrow { color: var(--muted); }
  .debt-row .amt { margin-left: auto; font-weight: 700; }
  .debt-row .btn { margin-left: 10px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text);
  }
  .tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .group-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { font-size: 12px; background: #eef7f4; color: var(--green-dark); padding: 3px 10px; border-radius: 12px; font-weight: 600; }
  .badge.pot { background: #fff4e5; color: #9a5b00; }
  .period-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .period-nav .label { font-weight: 700; min-width: 170px; text-align: center; }
  .banner { background: #e8f8f3; border: 1px solid #bfe9db; border-radius: 8px; padding: 12px; font-size: 13.5px; margin-bottom: 12px; line-height: 1.5; }
  .banner.warn { background: #fff7ec; border-color: #f7dcb4; }
  .claim-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .invite { display: flex; gap: 8px; }
  .invite input { font-size: 13px; color: var(--muted); }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); z-index: 20; max-width: calc(100% - 32px);
  }

  /* ---------- Übersicht / Diagramme ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .k-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .kpi .k-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .charts .card { margin-bottom: 0; }
  .charts .wide { grid-column: 1 / -1; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: #4a5a68; margin-bottom: 10px; flex-wrap: wrap; }
  .legend i, .cat-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .hbar-row { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; padding: 6px 0; }
  .hbar-row .name { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-pair { display: flex; flex-direction: column; gap: 2px; }
  .hbar-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a5a68; height: 14px; }
  .hbar-track { flex: 1; min-width: 0; }
  .hbar-line > span { width: 72px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .hbar { height: 12px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .donut-wrap svg { flex-shrink: 0; }
  .donut-wrap circle.seg { cursor: default; }
  .donut-wrap circle.seg:hover { stroke-width: 26; }
  .cat-legend { flex: 1; min-width: 170px; font-size: 13px; }
  .cat-legend div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
  .cat-legend span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cols { position: relative; height: 170px; display: flex; align-items: flex-end; gap: 2px; padding-left: 52px; border-bottom: 1px solid var(--axis); }
  .cols .gl { position: absolute; left: 52px; right: 0; border-top: 1px solid var(--grid); }
  .cols .gl span { position: absolute; left: -52px; top: -8px; width: 46px; text-align: right; font-size: 11px; color: #898781; font-variant-numeric: tabular-nums; }
  .cols .col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; z-index: 1; }
  .cols .col:hover { background: rgba(36,49,61,.05); }
  .cols .bar { width: 100%; max-width: 56px; background: var(--s1); border-radius: 4px 4px 0 0; }
  .cols .col.current .bar { background: #1c5cab; }
  .xlabels { display: flex; gap: 2px; padding-left: 52px; margin-top: 4px; }
  .xlabels span { flex: 1; font-size: 11px; color: #898781; text-align: center; white-space: nowrap; overflow: hidden; }
  .progress { height: 10px; background: #eef2f4; border-radius: 5px; overflow: hidden; margin-top: 4px; position: relative; }
  .progress div { height: 100%; background: var(--s3); border-radius: 0 4px 4px 0; }
  .pot-row { padding: 6px 0; font-size: 13.5px; }
  .pot-row .top { display: flex; justify-content: space-between; gap: 8px; }
  #tip {
    position: fixed; pointer-events: none; background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); z-index: 30; white-space: pre-line; max-width: 240px;
  }
  .selftest td, .selftest th { padding: 4px 10px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }

  @media (max-width: 760px) {
    header { padding: 10px 16px; }
    .user .uname { display: none; }
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
    .row { flex-direction: column; }
    .charts { grid-template-columns: 1fr; }
    .period-nav .label { min-width: 0; flex: 1; }
    .tab { padding: 7px 12px; font-size: 13.5px; }
  }
</style>
</head>
<body>
<header>
  <span class="logo">🐻</span><h1>PookieWise</h1>
  <div class="user" id="userBox" hidden></div>
</header>

<section id="screenLoading"><div class="card center-card"><p>Lade …</p></div></section>

<section id="screenSetup" hidden>
  <div class="card center-card">
    <h2>Fast fertig</h2>
    <p>PookieWise braucht noch die Firebase-Konfiguration. Trage sie in <code>firebase-config.js</code> ein – die Schritte stehen in der <code>README.md</code>.</p>
  </div>
</section>

<section id="screenLogin" hidden>
  <div class="card center-card">
    <h2>Ausgaben gemeinsam teilen</h2>
    <p id="loginText">Melde dich an, um deine Gruppen auf allen Geräten zu sehen und mit anderen zu teilen.</p>
    <button class="btn google" data-action="login">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Mit Google anmelden
    </button>
    <p class="note" id="loginError" hidden></p>
  </div>
</section>

<section id="screenApp" hidden>
  <div class="layout">
    <div class="sidebar">
      <div id="migrateBox"></div>
      <div class="card">
        <h2>Gruppen</h2>
        <div id="groupList"></div>
        <button class="btn block" style="margin-top:10px" data-action="newGroup">+ Neue Gruppe</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</section>

<section id="screenSelftest" hidden><div class="card center-card" id="selftestOut"></div></section>

<div id="toast" hidden></div>
<div id="tip" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
